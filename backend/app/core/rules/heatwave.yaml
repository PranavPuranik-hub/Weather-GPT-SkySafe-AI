hazard: heatwave
rules:
  # Grade A (Act Now / Evacuate)
  - grade: A
    persona: general
    actions:
      - id: ACT-HW-A-GEN-01
        template: "Avoid direct outdoor sunlight in {area} between 11 AM and 4 PM during extreme heat of {temperature_c} °C."
        fact_fields: ["area", "temperature_c"]
      - id: ACT-HW-A-GEN-02
        template: "Drink ORS, buttermilk, or lemon water frequently even if not feeling thirsty."
        fact_fields: []
      - id: ACT-HW-A-GEN-03
        template: "Seek immediate medical assistance if experiencing dizziness, high body temperature, or confusion."
        fact_fields: []

  - grade: A
    persona: farmer
    actions:
      - id: ACT-HW-A-FARM-01
        template: "Suspend all outdoor field labor and plowing in {area} between 11 AM and 4 PM."
        fact_fields: ["area"]
      - id: ACT-HW-A-FARM-02
        template: "Keep cattle under well-ventilated thatched sheds with continuous access to clean drinking water."
        fact_fields: []
      - id: ACT-HW-A-FARM-03
        template: "Apply light frequent irrigation to standing crops during early morning or late evening."
        fact_fields: []

  - grade: A
    persona: fisherman
    actions:
      - id: ACT-HW-A-FISH-01
        template: "UNSAFE: Extreme heat of {temperature_c} °C on open water. Limit outdoor fishing to early morning hours."
        fact_fields: ["temperature_c"]
      - id: ACT-HW-A-FISH-02
        template: "Carry ample ice and insulated boxes to prevent fish catch spoilage."
        fact_fields: []

  - grade: A
    persona: elderly_alone
    actions:
      - id: ACT-HW-A-ELD-01
        template: "Remain indoors in the coolest room with damp towels or fans in {area}."
        fact_fields: ["area"]
      - id: ACT-HW-A-ELD-02
        template: "Drink hydrating fluids regularly and keep medical prescriptions nearby."
        fact_fields: []

  - grade: A
    persona: pregnant_infants
    actions:
      - id: ACT-HW-A-PREG-01
        template: "Keep pregnant women and infants indoors in shaded, well-ventilated rooms in {area}."
        fact_fields: ["area"]
      - id: ACT-HW-A-PREG-02
        template: "Dress infants in light cotton clothes and offer frequent hydration."
        fact_fields: []

  # Grade B (Prepare to Act)
  - grade: B
    persona: general
    actions:
      - id: ACT-HW-B-GEN-01
        template: "Prepare for severe heatwave in {area} with temperatures reaching {temperature_c} °C."
        fact_fields: ["area", "temperature_c"]
      - id: ACT-HW-B-GEN-02
        template: "Stock ORS packets, glucose, and earthenware water pots."
        fact_fields: []

  - grade: B
    persona: farmer
    actions:
      - id: ACT-HW-B-FARM-01
        template: "Arrange shade nets for nursery crops in {area}."
        fact_fields: ["area"]
      - id: ACT-HW-B-FARM-02
        template: "Ensure animal water troughs are filled."
        fact_fields: []

  - grade: B
    persona: fisherman
    actions:
      - id: ACT-HW-B-FISH-01
        template: "SAFE: Heatwave active; wear wide-brimmed hats and carry insulated water jugs in {area}."
        fact_fields: ["area"]
      - id: ACT-HW-B-FISH-02
        template: "Cover boat deck to reduce heat reflection."
        fact_fields: []

  - grade: B
    persona: elderly_alone
    actions:
      - id: ACT-HW-B-ELD-01
        template: "Ask family or neighbor to check on hydration levels twice daily in {area}."
        fact_fields: ["area"]
      - id: ACT-HW-B-ELD-02
        template: "Avoid heavy, oily meals."
        fact_fields: []

  - grade: B
    persona: pregnant_infants
    actions:
      - id: ACT-HW-B-PREG-01
        template: "Ensure cool environment and adequate fluid intake in {area}."
        fact_fields: ["area"]
      - id: ACT-HW-B-PREG-02
        template: "Monitor infant for heat rash or fever."
        fact_fields: []

  # Grade C (Stay Alert)
  - grade: C
    persona: general
    actions:
      - id: ACT-HW-C-GEN-01
        template: "Stay alert for rising temperatures in {area}."
        fact_fields: ["area"]
      - id: ACT-HW-C-GEN-02
        template: "Wear light-colored loose cotton clothing."
        fact_fields: []

  - grade: C
    persona: farmer
    actions:
      - id: ACT-HW-C-FARM-01
        template: "Monitor soil moisture in crop fields in {area}."
        fact_fields: ["area"]
      - id: ACT-HW-C-FARM-02
        template: "Provide shade for young livestock."
        fact_fields: []

  - grade: C
    persona: fisherman
    actions:
      - id: ACT-HW-C-FISH-01
        template: "SAFE: Normal coastal fishing with hydration precautions in {area}."
        fact_fields: ["area"]
      - id: ACT-HW-C-FISH-02
        template: "Carry extra drinking water."
        fact_fields: []

  - grade: C
    persona: elderly_alone
    actions:
      - id: ACT-HW-C-ELD-01
        template: "Stay in well-ventilated rooms in {area}."
        fact_fields: ["area"]
      - id: ACT-HW-C-ELD-02
        template: "Drink water at regular intervals."
        fact_fields: []

  - grade: C
    persona: pregnant_infants
    actions:
      - id: ACT-HW-C-PREG-01
        template: "Avoid sun exposure during peak noon hours in {area}."
        fact_fields: ["area"]
      - id: ACT-HW-C-PREG-02
        template: "Maintain adequate rest."
        fact_fields: []

  # Grade D (Information Only)
  - grade: D
    persona: general
    actions:
      - id: ACT-HW-D-GEN-01
        template: "Normal summer advisory for {area}."
        fact_fields: ["area"]
      - id: ACT-HW-D-GEN-02
        template: "Drink regular water."
        fact_fields: []

  - grade: D
    persona: farmer
    actions:
      - id: ACT-HW-D-FARM-01
        template: "Normal agricultural activities in {area}."
        fact_fields: ["area"]
      - id: ACT-HW-D-FARM-02
        template: "Standard crop management."
        fact_fields: []

  - grade: D
    persona: fisherman
    actions:
      - id: ACT-HW-D-FISH-01
        template: "SAFE: Normal sea conditions in {area}."
        fact_fields: ["area"]
      - id: ACT-HW-D-FISH-02
        template: "Standard marine guidelines."
        fact_fields: []

  - grade: D
    persona: elderly_alone
    actions:
      - id: ACT-HW-D-ELD-01
        template: "Normal routine in {area}."
        fact_fields: ["area"]
      - id: ACT-HW-D-ELD-02
        template: "Stay comfortable indoors."
        fact_fields: []

  - grade: D
    persona: pregnant_infants
    actions:
      - id: ACT-HW-D-PREG-01
        template: "Normal prenatal routine in {area}."
        fact_fields: ["area"]
      - id: ACT-HW-D-PREG-02
        template: "Standard healthcare."
        fact_fields: []
